<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FOMO AI Filter</title>
  <style>
    :root {
      --bg: #0d0d12;
      --card: #16161f;
      --border: #2a2a38;
      --text: #e8e8f0;
      --muted: #8b8b9e;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --accent: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      line-height: 1.4;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    .refresh-btn {
      background: var(--blue);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .ai-box {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .ai-box h3 {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .token-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .token-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .token-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .token-name {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .token-symbol {
      color: var(--muted);
      font-size: 0.85rem;
      margin-right: 6px;
    }
    .change {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .change.up { color: var(--green); }
    .change.down { color: var(--red); }
    .token-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .token-stats span {
      background: #1e1e2a;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .token-link {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--blue);
      text-decoration: none;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">FOMO <span>AI</span></div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">تحديث</button>
  </header>

  <div class="meta" id="meta">آخر تحديث: --</div>

  <div class="ai-box" id="aiBox">
    <h3>ترشيح الذكاء الاصطناعي</h3>
    <div id="aiText">اضغط تحديث لجلب التوصيات...</div>
  </div>

  <div class="token-list" id="tokenList">
    <div class="empty">لا توجد بيانات بعد</div>
  </div>

  <footer>فلتر ميم كوينز بسيط · يعمل مع FOMO</footer>

  <script>
    async function loadData() {
      try {
        const res = await fetch("/api/results");
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById("aiText").textContent = "خطأ في الاتصال";
      }
    }

    async function refreshData() {
      const btn = document.getElementById("refreshBtn");
      btn.disabled = true;
      btn.textContent = "جاري...";
      document.getElementById("aiText").textContent = "جاري جلب وتحليل البيانات...";
      
      try {
        const res = await fetch("/api/refresh");
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById("aiText").textContent = "فشل التحديث. حاول مرة أخرى.";
      }
      btn.disabled = false;
      btn.textContent = "تحديث";
    }

    function render(data) {
      document.getElementById("meta").textContent = "آخر تحديث: " + (data.updated_at || "--");
      
      const ai = data.ai_summary || data.message || "لا يوجد ترشيح";
      document.getElementById("aiText").textContent = ai;

      const list = document.getElementById("tokenList");
      const tokens = data.tokens || [];

      if (!tokens.length) {
        list.innerHTML = '<div class="empty">لا توجد عملات مطابقة حالياً</div>';
        return;
      }

      list.innerHTML = tokens.map(t => {
        const changeClass = (t.change_24h || 0) >= 0 ? "up" : "down";
        const changeSign = (t.change_24h || 0) >= 0 ? "+" : "";
        const age = t.age_hours != null ? t.age_hours + "h" : "—";
        return `
          <div class="token-card">
            <div class="token-top">
              <div>
                <span class="token-name">${t.symbol}</span>
                <span class="token-symbol">${t.name}</span>
              </div>
              <div class="change ${changeClass}">${changeSign}${t.change_24h}%</div>
            </div>
            <div class="token-stats">
              <span>السيولة $${Number(t.liquidity).toLocaleString()}</span>
              <span>الحجم $${Number(t.volume_24h).toLocaleString()}</span>
              <span>العمر ${age}</span>
            </div>
            <a class="token-link" href="${t.url}" target="_blank" rel="noopener">فتح في DexScreener ←</a>
          </div>
        `;
      }).join("");
    }

    loadData();
  </script>
</body>
</html>
